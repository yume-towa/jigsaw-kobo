<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a2a24">
<meta name="description" content="手持ちの写真がそのままジグソーパズルになるブラウザゲーム。印刷して紙のパズルも作れます。">
<title>ジグソー工房</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129513;</text></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #233830; overscroll-behavior: none; }
  #root { height: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
  /* 読み込み中の表示 */
  #boot { height: 100%; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 14px; color: #f2ead9;
          font-family: 'Hiragino Maru Gothic ProN', sans-serif; }
  #boot .mark { font-size: 44px; }
  #boot .msg { font-size: 13px; opacity: .75; text-align: center; line-height: 1.8; padding: 0 24px; }
</style>
</head>
<body>

<div id="root">
  <div id="boot">
    <div class="mark">&#129513;</div>
    <div class="msg">読み込んでいます…<br><span id="boot-note"></span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
  // ライブラリが読めなかったときに、白画面ではなく理由を出す
  window.addEventListener("load", function () {
    if (!window.React || !window.ReactDOM) {
      var n = document.getElementById("boot-note");
      if (n) n.textContent = "部品の読み込みに失敗しました。ネットにつないで開き直してください。";
    }
  });
</script>
<script src="app.js"></script>

</body>
</html>
